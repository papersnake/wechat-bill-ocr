# 复制为 config.toml 后修改

[device]
# 留空则自动选择第一个已连接设备
serial = ""
adb_host = "127.0.0.1"
adb_port = 5037

[ocr]
# 目前支持: rapid（推荐，轻量）
engine = "rapid"
lang = "ch"

[parse]
# 列表可视区：顶部占屏幕高度的比例（避开微信头部导航）
list_top_ratio = 0.18
# 底部边缘像素，贴边行会被丢弃
edge_bottom_px = 24
# 金额与描述/时间的 Y 方向容差
amount_y_tolerance = 80
# 收入关键词（无 +/- 符号时用于判断方向）
income_keywords = ["退款", "收款", "入账", "红包", "工资", "来自"]

[collect]
max_scrolls = 100
scroll_duration_ms = 350
wait_after_scroll = 1.2
# 连续多少屏没有新记录就停止
no_new_threshold = 2

[output]
dir = "output"
# 调试时设为 true，会保存每屏截图
save_screenshots = false
